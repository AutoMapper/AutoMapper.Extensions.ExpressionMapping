name: Release

on:
  release:
    types: [published]

jobs:
  build:

    runs-on: windows-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v2
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 11.x

    - name: Test
      run: dotnet test --configuration Release --verbosity normal --results-directory ./TestResults/ -- --coverage --coverage-output-format xml --coverage-output coverage.xml

    - name: Pack and push
      env:
        PROJECT_NAME: AutoMapper.Extensions.ExpressionMapping
        DEPLOY_PACKAGE_URL: https://api.nuget.org/v3/index.json
        DEPLOY_PACKAGE_API_KEY: ${{ secrets.NUGET_API_KEY }}
        REPO: ${{ github.repository }}
        REPO_OWNER: ${{ github.repository_owner }}
      run: ./Pack_Push.ps1
      shell: pwsh
